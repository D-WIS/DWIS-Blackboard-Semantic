name: Pull request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Find the solution
        id: sln
        run: |
          f=$(ls *.sln *.slnx 2>/dev/null | head -1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -z "$f" ]; then echo "No solution yet; nothing to build."; fi
      - name: Restore
        if: steps.sln.outputs.file != ''
        run: dotnet restore "${{ steps.sln.outputs.file }}"
      - name: Build
        if: steps.sln.outputs.file != ''
        run: dotnet build "${{ steps.sln.outputs.file }}" -c Release --no-restore
      - name: Check out the Fuseki image sources (DWIS-Blackboard-Tests)
        if: steps.sln.outputs.file != ''
        uses: actions/checkout@v7
        with:
          repository: D-WIS/DWIS-Blackboard-Tests
          ref: main
          path: fuseki-image
      - name: Build the Fuseki image for the contract tests
        if: steps.sln.outputs.file != ''
        run: docker build --build-arg JENA_VERSION=6.2.0 --build-arg ALPINE_VERSION=3.24 -t digiwells/dwis.blackboard.fuseki:ci fuseki-image/fuseki
      - name: Test
        if: steps.sln.outputs.file != ''
        env:
          # The contract tests run against the image built above and fail, rather than skip, without it.
          DWIS_FUSEKI_IMAGE: digiwells/dwis.blackboard.fuseki:ci
          DWIS_FUSEKI_REQUIRED: "true"
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --report-trx --results-directory TestResults
      - name: Upload test results
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Build the image (not pushed)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: digiwells/dwis.blackboard.semantic:pr-${{ github.run_number }}
      - name: Scan the image
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digiwells/dwis.blackboard.semantic:pr-${{ github.run_number }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

