name: Merge to main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-main
  cancel-in-progress: false
jobs:
  build-and-push:
    name: Build, test and push edge image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Find the solution
        id: sln
        run: |
          f=$(ls *.sln *.slnx 2>/dev/null | head -1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -z "$f" ]; then echo "No solution yet; nothing to build."; fi
      - name: Restore
        if: steps.sln.outputs.file != ''
        run: dotnet restore "${{ steps.sln.outputs.file }}"
      - name: Build
        if: steps.sln.outputs.file != ''
        run: dotnet build "${{ steps.sln.outputs.file }}" -c Release --no-restore
      - name: Test
        if: steps.sln.outputs.file != ''
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push sha and edge tags
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            digiwells/dwis.blackboard.semantic:sha-${{ github.sha }}
            digiwells/dwis.blackboard.semantic:edge
      - name: Scan the pushed image
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: digiwells/dwis.blackboard.semantic:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Tell the tests repository
        if: hashFiles('Dockerfile') != ''
        env:
          GH_TOKEN: ${{ secrets.RIG_EDITION_DISPATCH_TOKEN }}
        run: |
          gh api repos/D-WIS/DWIS-Blackboard-Tests/dispatches \
            -f event_type=semantic-edge \
            -F "client_payload[image]=digiwells/dwis.blackboard.semantic:sha-${{ github.sha }}"
